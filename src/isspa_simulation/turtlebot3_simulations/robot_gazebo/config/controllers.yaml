diff_drive_controller:
  type: "diff_drive_controller/DiffDriveController"
  left_wheel: "left_rear_wheel_joint"    # 左轮的关节名称
  right_wheel: "right_rear_wheel_joint"  # 右轮的关节名称
  publish_rate: 50                  # 发布频率
  velocity_rolling_average_window: 5
  wheel_separation: 0.5             # 左右轮之间的距离
  wheel_radius: 0.1                # 轮子的半径

left_rear_wheel_velocity_controller:
  type: "effort_controllers/JointVelocityController"
  joint: "left_rear_wheel_joint"

right_rear_wheel_velocity_controller:
  type: "effort_controllers/JointVelocityController"
  joint: "right_rear_wheel_joint"


joint_state_controller:
  type: "joint_state_controller/JointStateController"
  publish_rate: 50

# controllers.yaml
prismatic_x_controller:
  type: effort_controllers/JointPositionController
  joint: x_translation_joint

prismatic_z_controller:
  type: effort_controllers/JointPositionController
  joint: z_translation_joint
